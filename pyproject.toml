[project]
name = "code-review-env"
version = "1.0.0"
description = "Smart Code Review Environment for Meta PyTorch OpenEnv Hackathon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.dependencies]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.25.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.openenv]
name = "code-review-env"
version = "1.0.0"
description = "Smart Code Review RL Environment"
entry_point = "main:app"
port = 7860
